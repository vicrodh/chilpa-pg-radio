[package]
name = "chilpa-pg-radio"
description = "Internet radio for Chilpa, as a plugin"
version = "0.1.2"
edition = "2021"
license = "MIT"
rust-version = "1.90"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chilpa-plugin-sdk = { git = "https://github.com/vicrodh/chilpa-plugins-sdk", tag = "protocol-4" }
serde = { version = "1", features = ["derive"] }

# The module is loaded and compiled by Chilpa on every start, so it is built
# small: no debug information, no unwinding.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
serde_json = "1"
